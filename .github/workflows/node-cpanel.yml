name: Node + cPanel CI (reusable)

# Reusable workflow consumed by every KTT-* Node.js / Next.js repo.
# Runs lint + test + build on push and pull request.
# Deploy steps are intentionally NOT here — production cPanel pulls via
# the KTT-Deploy-Bot GitHub App. See docs/CPANEL_DEPLOYMENT.md.

on:
  workflow_call:
    inputs:
      app_path:
        description: "Absolute path of the app on the cPanel server (informational, used in summary)"
        required: false
        type: string
        default: ""
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      package_manager:
        description: "npm | pnpm"
        required: false
        type: string
        default: "npm"
      run_tests:
        description: "Whether to run the test script"
        required: false
        type: boolean
        default: true
      run_build:
        description: "Whether to run the build script"
        required: false
        type: boolean
        default: true
      working_directory:
        description: "Working directory inside the repo"
        required: false
        type: string
        default: "."

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm run lint --if-present
          else
            npm run lint --if-present
          fi

      - name: Test
        if: inputs.run_tests
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm test --if-present
          else
            npm test --if-present
          fi

      - name: Build
        if: inputs.run_build
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm run build --if-present
          else
            npm run build --if-present
          fi

      - name: Summary
        run: |
          echo "## CI complete" >> $GITHUB_STEP_SUMMARY
          echo "- App path on cPanel: \`${{ inputs.app_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Node: \`${{ inputs.node_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Package manager: \`${{ inputs.package_manager }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy is performed by cPanel via KTT-Deploy-Bot, not by this workflow." >> $GITHUB_STEP_SUMMARY
